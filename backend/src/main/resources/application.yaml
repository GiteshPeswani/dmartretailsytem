spring:
  application:
    name: dmart-blockchain-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dmart_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: gitesh
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:dmartBlockchainSecretKey2024ChangeThisInProductionToAtLeast256BitsLong}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  blockchain:
    enabled: ${BLOCKCHAIN_ENABLED:true}
    rpc-url: ${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
    contract-address: ${BLOCKCHAIN_CONTRACT_ADDRESS:0x0165878A594ca255338adfa4d48449f69242Eb8F}
    operator-private-key: ${BLOCKCHAIN_OPERATOR_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
    chain-id: ${BLOCKCHAIN_CHAIN_ID:1337}
    retry-attempts: 3
    retry-delay-ms: 2000

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

  upload:
    dir: ${UPLOAD_DIR:uploads/products}
    max-file-size: 5MB

logging:
  level:
    com.dmart: DEBUG
    org.web3j: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
