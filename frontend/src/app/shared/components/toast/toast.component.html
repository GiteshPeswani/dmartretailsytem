<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
  <div *ngFor="let toast of toastService.toasts()" 
       class="toast show align-items-center text-white border-0 shadow mb-2" 
       [ngClass]="'bg-' + toast.type" 
       role="alert">
    <div class="d-flex">
      <div class="toast-body d-flex align-items-center gap-2">
        <i class="bi" [ngClass]="{
          'bi-check-circle-fill': toast.type === 'success',
          'bi-exclamation-triangle-fill': toast.type === 'danger',
          'bi-exclamation-circle-fill': toast.type === 'warning',
          'bi-info-circle-fill': toast.type === 'info'
        }"></i>
        <span>{{ toast.message }}</span>
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="toastService.remove(toast.id)"></button>
    </div>
  </div>
</div>
